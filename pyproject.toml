[project]
name = "pokebot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "poke-env>=0.16.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
